<div class="container d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card shadow p-4" style="width: 400px; border-radius: 1rem;">
    <div class="card-body">
      <h3 class="text-center mb-4 text-primary fw-bold">Connexion</h3>

      <form (ngSubmit)="submit()" [formGroup]="form">
        <div class="mb-3">
          <label for="username" class="form-label">Nom d'utilisateur</label>
          <input
            id="username"
            type="text"
            class="form-control"
            formControlName="username"
            placeholder="Entrez votre nom"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Mot de passe</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="Entrez votre mot de passe"
          />
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary btn-block">
            Se connecter
          </button>
        </div>
      </form>

      <p *ngIf="error" class="text-danger text-center mt-3">{{ error }}</p>

      <div class="alert alert-info mt-4 mb-0 text-center" style="font-size: 0.9rem;">
        <p class="mb-1 fw-semibold">Compte de test :</p>
        <p><strong>username: admin / mdp: admin</strong> (Admin)</p>
      </div>
    </div>
  </div>
</div>
